<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply chain</title>
  <link rel="stylesheet" href="/static/editor.css">
</head>
<body>
  <aside id="sidebar">
    <h1>Supply chain</h1>
    <p class="hint">Input and output nodes are counted in energy analysis. Sources and sinks are not. Unconnected recipe outputs are treated as waste.</p>
    <label class="field">Search recipes
      <input id="recipe-search" type="search" placeholder="iron-gear…" autocomplete="off">
    </label>
    <ul id="recipe-list"></ul>
    <div class="actions">
      <button type="button" id="add-source">Add source</button>
      <button type="button" id="add-sink">Add sink</button>
      <button type="button" id="add-input">Add input</button>
      <button type="button" id="add-output">Add output</button>
      <button type="button" id="add-boiler">Add boiler</button>
      <button type="button" id="add-generator">Add generator</button>
    </div>
    <div class="actions">
      <button type="button" id="download">Download JSON</button>
      <label class="file-label">Upload JSON
        <input id="upload" type="file" accept="application/json">
      </label>
    </div>
    <section id="issues" aria-live="polite"></section>
    <section id="analysis" aria-live="polite"></section>
  </aside>
  <main>
    <div id="canvas">
      <svg id="wires" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="nodes"></div>
    </div>
  </main>
  <script src="/static/editor.js"></script>
</body>
</html>
